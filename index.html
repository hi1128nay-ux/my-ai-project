<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>my-ai-project | アイデア・プロジェクト管理</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#253248;background:#f7f8fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#313c6a,#7776ae);color:white;padding:38px max(24px,calc((100% - 960px)/2));}h1{margin:0 0 10px;font-size:clamp(28px,5vw,42px)}header p{margin:0;opacity:.94}main{max-width:960px;margin:28px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.stat,.panel,.item{background:white;border:1px solid #e9eaf2;border-radius:16px;box-shadow:0 4px 20px #25324808}.stat{padding:18px;text-align:center}.stat strong{display:block;font-size:28px;color:#50549a}.stat span{font-size:13px;color:#697184}.panel{padding:22px;margin:18px 0}h2{margin:0 0 15px;font-size:20px}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}input,select,button{font:inherit;border-radius:9px;padding:12px;border:1px solid #ccd1e2;min-width:0}button{cursor:pointer;background:#575da0;color:white;border:0;font-weight:bold}button:hover{background:#414780}.secondary{background:white;color:#4c528d;border:1px solid #bbbfe1}.secondary:hover{background:#f0f0ff}.tasks{display:grid;gap:12px}.item{padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.item strong{display:block;margin-bottom:5px}.item small{color:#6e7690}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controls select{padding:9px}.remove{background:#fff0f0;color:#a9384f;padding:9px 12px}.remove:hover{background:#fbe0e0}.hint{color:#6e7690;font-size:13px;line-height:1.7}footer{text-align:center;color:#758097;padding:12px 20px 30px;font-size:13px}@media(max-width:650px){.form{grid-template-columns:1fr}.stats{gap:6px}.stat{padding:12px 6px}.item{align-items:stretch;flex-direction:column}.controls{justify-content:space-between}header{padding:30px 22px}}
</style>
</head>
<body>
<header><h1>my-ai-project</h1><p>AI × デジタル商品のアイデアを、形にするための管理ページ</p></header>
<main>
<section class="stats"><div class="stat"><strong id="total">0</strong><span>全プロジェクト</span></div><div class="stat"><strong id="doing">0</strong><span>進行中</span></div><div class="stat"><strong id="done">0</strong><span>完了</span></div></section>
<section class="panel"><h2>新しいアイデアを登録</h2><form id="addForm" class="form"><input id="name" maxlength="100" required placeholder="例：海外向けデジタルプランナー" aria-label="プロジェクト名"><select id="category" aria-label="カテゴリー"><option>デジタル商品</option><option>AIアプリ</option><option>その他</option></select><button type="submit">追加する</button></form></section>
<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2>プロジェクト一覧</h2><button id="export" class="secondary" type="button">データを保存（JSON）</button></div><div class="tasks" id="list" aria-live="polite"></div><p class="hint">内容はこのブラウザ内に保存されます。別の端末には自動同期されません。定期的に「データを保存」でバックアップしてください。</p></section>
</main><footer>my-ai-project — 初期バージョン 1.0</footer>
<script>
(()=>{'use strict';const KEY='my-ai-project-v1';let projects;try{const raw=localStorage.getItem(KEY);projects=raw?JSON.parse(raw):[{id:1,name:'デジタル商品のアイデアを整理する',category:'デジタル商品',status:'進行中'},{id:2,name:'最初のAIツールを企画する',category:'AIアプリ',status:'未着手'}];if(!Array.isArray(projects))throw Error('invalid')}catch{projects=[]}const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(projects))}catch{alert('このブラウザでは保存できません。JSONでバックアップしてください。')}};function render(){ $('total').textContent=projects.length;$('doing').textContent=projects.filter(x=>x.status==='進行中').length;$('done').textContent=projects.filter(x=>x.status==='完了').length;const list=$('list');list.replaceChildren();if(!projects.length){const p=document.createElement('p');p.className='hint';p.textContent='まだアイデアがありません。上のフォームから登録してください。';list.append(p)}projects.forEach(item=>{const card=document.createElement('div');card.className='item';const info=document.createElement('div');const name=document.createElement('strong');name.textContent=item.name;const cat=document.createElement('small');cat.textContent=item.category;info.append(name,cat);const controls=document.createElement('div');controls.className='controls';const select=document.createElement('select');select.setAttribute('aria-label',item.name+' の進捗');['未着手','進行中','完了'].forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;select.append(o)});select.value=item.status;select.addEventListener('change',()=>{item.status=select.value;save();render()});const del=document.createElement('button');del.className='remove';del.textContent='削除';del.addEventListener('click',()=>{if(confirm('この項目を削除しますか？')){projects=projects.filter(x=>x.id!==item.id);save();render()}});controls.append(select,del);card.append(info,controls);list.append(card)})} $('addForm').addEventListener('submit',e=>{e.preventDefault();const name=$('name').value.trim();if(!name)return;projects.push({id:Date.now()+Math.random(),name,category:$('category').value,status:'未着手'});$('name').value='';save();render()});$('export').addEventListener('click',()=>{const data=JSON.stringify({version:1,exportedAt:new Date().toISOString(),projects},null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='my-ai-project-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});render()})();
</script>
</body></html>
